name: Windows desktop build
on:
  workflow_dispatch:
  push:
    paths: ['desktop/**', 'src/**', 'pyproject.toml', 'tools/generate_icon.py', '.github/workflows/windows-desktop.yml']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: pnpm/action-setup@v4
        with: {version: 9}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: 'pnpm', cache-dependency-path: 'desktop/pnpm-lock.yaml'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python backend and packager
        run: python -m pip install -e '.[secrets]' pyinstaller pytest
      - name: Test backend
        run: python -m pytest -q
      - name: Package Python service
        run: |
          python tools/generate_icon.py
          python -m PyInstaller --noconfirm --clean --onefile --name ai-news-service --collect-data ai_news_desktop --hidden-import keyring.backends.Windows tools/service_entry.py
          New-Item -ItemType Directory -Force desktop/src-tauri/service | Out-Null
          Copy-Item dist/ai-news-service.exe desktop/src-tauri/service/ai-news-service.exe
        shell: pwsh
      - name: Build desktop installer
        working-directory: desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: AI-News-Desktop-Windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
