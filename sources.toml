[settings]
refresh_minutes = 60
max_notifications_per_cycle = 3
max_article_age_hours = 48
notifications_enabled = true

[notifications]
categories = ["model_release", "research", "api_update", "product_update"]
exclude_keywords = ["partnership", "partner", "hiring", "careers", "recruitment", "sponsorship", "conference", "event"]

[llm]
mode = "disabled"
provider = "openrouter"
model = "openrouter/free"
api_key_ref = "env:OPENROUTER_API_KEY"
request_timeout = 20.0
max_articles_per_day = 20
max_requests_per_day = 30
max_input_tokens = 4000
max_output_tokens = 1000
max_retries = 2
batch_size = 3
cache_enabled = true

[news_filter]
min_relevance_score = 60
min_importance_score = 65
language = "zh-CN"
translate_titles = true

[[sources]]
name = "OpenAI News"
organization = "OpenAI"
type = "rss"
url = "https://openai.com/news/rss.xml"
enabled = true
category = "company_news"

[[sources]]
name = "Anthropic Newsroom"
organization = "Anthropic"
type = "webpage"
url = "https://www.anthropic.com/news"
enabled = true
category = "company_news"
card_tag = "li"
card_attribute = "data-listing-row"
link_prefix = "/news/"

[[sources]]
name = "DeepSeek Research & News"
organization = "DeepSeek"
type = "webpage"
url = "https://www.deepseek.com/en/news/"
enabled = true
category = "company_news"
card_tag = "a"
card_classes = ["ds-news-hero-card", "ds-news-list-item"]
link_prefix = "/en/news/"

[[sources]]
name = "Google DeepMind Blog"
organization = "Google DeepMind"
type = "rss"
url = "https://deepmind.google/blog/rss.xml"
enabled = true
category = "research"
